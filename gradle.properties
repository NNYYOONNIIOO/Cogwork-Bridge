# Gradle Properties
org.gradle.jvmargs = -Xmx4G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Set this to true if you want to use old LWJGL2 methods.
# Cogwork Bridge keeps this ON: 1.12.2 rendering still relies on LWJGL2-era GL entry points.
enable_lwjglx = true

# Mod Information
mod_version = 0.1.0-alpha
root_package = com.cogwork
mod_id = cogworkbridge
mod_name = Cogwork Bridge

# Mod Metadata (Optional)
mod_description = A Create bridge for Minecraft 1.12.2 on Cleanroom; requires the original Create 1.21.1 jar in mods. Third-party components retain their own terms. See META-INF/licenses.
mod_url = https://github.com/
mod_update_json =
mod_authors = Cogwork Bridge Contributors
mod_credits = Behaviour and content specification derived from Create 6.0.11 (MIT code / ARR assets) by the Creators of Create.
mod_logo_path =
mod_issue_tracker =
mod_license = MIT AND Apache-2.0

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = Cogwork Bridge
maven_url =

# Access Transformers
use_access_transformer = true

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.cogwork.cogworkbridge.core.CogworkBridgeCore

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
