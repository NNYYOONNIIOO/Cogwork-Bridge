name: Build Cogwork Bridge

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'libs/**'
      - 'settings.gradle'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'libs/**'
      - 'settings.gradle'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installable mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon jar

      - name: Collect installable mod JAR
        run: |
          mkdir -p build/artifacts
          find build/libs -maxdepth 1 -type f -name 'cogworkbridge-*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} build/artifacts/ \;
          test -n "$(find build/artifacts -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: cogworkbridge-${{ github.sha }}
          path: build/artifacts/*.jar
          if-no-files-found: error
          retention-days: 90
